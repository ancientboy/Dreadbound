name: Deploy Web build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Godot build cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/godot-${{ env.GODOT_VERSION }}
          key: godot-web-${{ runner.os }}-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot and Web export templates
        run: |
          set -euo pipefail
          mkdir -p ".ci-cache/godot-${GODOT_VERSION}"
          cache_dir=".ci-cache/godot-${GODOT_VERSION}"
          download() {
            local url="$1"
            local destination="$2"
            # GitHub's release CDN can reset a large transfer. Resume partial files
            # and retry transient connection failures before failing the build.
            curl --fail --location --continue-at - --retry 5 --retry-all-errors --retry-delay 5 \
              --output "$destination" "$url"
          }
          if [ ! -s "$cache_dir/godot.zip" ]; then
            download "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" "$cache_dir/godot.zip"
          fi
          if [ ! -s "$cache_dir/templates.tpz" ]; then
            download "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" "$cache_dir/templates.tpz"
          fi
          cp "$cache_dir/godot.zip" godot.zip
          cp "$cache_dir/templates.tpz" templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Run gameplay checks
        run: |
          set -o pipefail
          GODOT="./Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          # Fresh runners import fonts and Web assets on first boot; 60 seconds was too short.
          timeout 180 "$GODOT" --headless --path . --editor --quit
          for test_script in tests/test_*.gd; do
            echo "Running ${test_script}"
            log_file="$(mktemp)"
            timeout 90 "$GODOT" --headless --path . --script "$test_script" 2>&1 | tee "$log_file"
            exit_code=${PIPESTATUS[0]}
            if [ "$exit_code" -ne 0 ]; then
              if [ "$exit_code" -eq 124 ]; then
                echo "Gameplay check timed out after 90 seconds: ${test_script}"
              fi
              exit "$exit_code"
            fi
            # Godot's headless script runner can report its global resource-cache
            # cleanup diagnostic after otherwise-successful audio tests. Keep the
            # real engine/script failures fatal without rejecting that known exit
            # message.
            if grep -E 'ERROR|SCRIPT ERROR|Parse Error|Assertion failed' "$log_file" | grep -Ev 'resources still in use at exit|ObjectDB instances were leaked at exit' >/dev/null; then
              echo "Godot reported an error in ${test_script}"
              exit 1
            fi
            rm -f "$log_file"
          done

      - name: Export Web build
        run: |
          mkdir -p builds/web
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release Web builds/web/index.html
          printf '{"revision":"%s"}\n' "$GITHUB_SHA" > builds/web/version.json
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          page = Path("builds/web/index.html")
          # Godot packages imported audio in the PCK. Keep a public copy for the
          # native HTMLAudio fallback used by Android virtual-browser containers
          # whose WebAudio worklet never resumes.
          shutil.copytree("assets/audio", "builds/web/assets/audio", dirs_exist_ok=True)
          html = page.read_text()
          updater = """<script>
          (() => {
            const key = "dreadbound-deployed-revision";
            fetch(`version.json?check=${Date.now()}`, { cache: "no-store" })
              .then((response) => response.json())
              .then(({ revision }) => {
                const previous = localStorage.getItem(key);
                localStorage.setItem(key, revision);
                if (previous && previous !== revision) location.reload();
              })
              .catch(() => {});
          })();
          </script>"""
          native_audio = """<script>
          (() => {
            const base = "assets/audio/";
            let unlocked = false, musicEnabled = true, sfxEnabled = true;
            let music = null, ambience = null;
            const source = (path) => encodeURI(String(path || "").replace(/^res:\\/\\//, ""));
            const make = (path, loop, volume) => {
              if (!path) return null;
              const audio = new Audio(source(path));
              audio.preload = "auto"; audio.loop = loop; audio.volume = volume;
              return audio;
            };
            const start = (audio) => {
              if (!audio) return;
              const result = audio.play();
              if (result) result.catch(() => {});
            };
            const unlock = () => {
              if (unlocked) return;
              unlocked = true;
              // A real media play inside the browser's native gesture handler
              // establishes audio permission before Godot processes the touch.
              const primer = make(base + "sfx/ui/ui_confirm_01.wav", false, 0.001);
              start(primer);
              setTimeout(() => { if (primer) { primer.pause(); primer.currentTime = 0; } }, 250);
              if (musicEnabled) { start(music); start(ambience); }
            };
            for (const event of ["pointerdown", "touchstart", "keydown"]) {
              document.addEventListener(event, unlock, { capture: true, passive: event !== "keydown" });
            }
            const replaceLoop = (kind, path) => {
              const previous = kind === "music" ? music : ambience;
              if (previous) previous.pause();
              const next = make(path, true, kind === "music" ? 0.62 : 0.46);
              if (kind === "music") music = next; else ambience = next;
              if (unlocked && musicEnabled) start(next);
            };
            window.DreadboundNativeAudio = {
              unlock,
              play(path, _group, gain) { if (unlocked && sfxEnabled) start(make(path, false, Number.isFinite(gain) ? gain : 0.9)); },
              loop(path, kind) { replaceLoop(kind === "ambience" ? "ambience" : "music", path); },
              setMusicEnabled(value) { musicEnabled = !!value; if (musicEnabled && unlocked) { start(music); start(ambience); } else { if (music) music.pause(); if (ambience) ambience.pause(); } },
              setSfxEnabled(value) { sfxEnabled = !!value; },
            };
          })();
          </script>"""
          page.write_text(html.replace("</head>", updater + native_audio + "\n</head>"))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
