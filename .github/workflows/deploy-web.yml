name: Deploy Web build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot and Web export templates
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Run gameplay checks
        run: |
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --editor --quit
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script tests/test_mission.gd
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script tests/test_combat.gd
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script tests/test_map.gd
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script tests/test_resources.gd
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script tests/test_content.gd
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script tests/test_progression.gd

      - name: Export Web build
        run: |
          mkdir -p builds/web
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release Web builds/web/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
