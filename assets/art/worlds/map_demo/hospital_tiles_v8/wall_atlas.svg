<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="128" viewBox="0 0 1024 128">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d0d1"/><stop offset="1" stop-color="#75969a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58787d"/><stop offset="1" stop-color="#29494f"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29484e"/><stop offset=".5" stop-color="#66888c"/><stop offset="1" stop-color="#a9c3c4"/>
    </linearGradient>
  </defs>
  <!-- North wall: its foot is exactly the tile's y=128 connection edge. -->
