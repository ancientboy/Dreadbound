<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="128" viewBox="0 0 1024 128">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d0d1"/><stop offset="1" stop-color="#75969a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58787d"/><stop offset="1" stop-color="#29494f"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29484e"/><stop offset=".5" stop-color="#66888c"/><stop offset="1" stop-color="#a9c3c4"/>
    </linearGradient>
  </defs>
  <!-- North wall: taller layered face, while its foot remains on y=128. -->
  <g>
    <path d="M0 48H128V70H0Z" fill="url(#cap)"/><path d="M0 70H128V128H0Z" fill="url(#face)"/>
    <path d="M0 69H128M0 126H128" stroke="#142f36" stroke-width="4"/>
    <path d="M7 77H121V119H7Z" fill="#416268" opacity=".48"/><path d="M32 80V116M96 80V116" stroke="#8ba9aa" stroke-width="2" opacity=".38"/>
    <path d="M8 54H120" stroke="#e0ecea" stroke-width="4" opacity=".48"/><path d="M0 120H128V128H0Z" fill="#102e35" opacity=".58"/>
    <path d="M4 44H18V128H4ZM110 44H124V128H110Z" fill="#759397" opacity=".28"/>
  </g>
  <!-- South foreground wall mirrors the taller rear-wall hierarchy. -->
  <g transform="translate(128)">
    <path d="M0 0H128V22H0Z" fill="url(#cap)"/><path d="M0 22H128V80H0Z" fill="url(#face)"/>
    <path d="M0 21H128M0 79H128" stroke="#142f36" stroke-width="4"/>
    <path d="M7 29H121V71H7Z" fill="#416268" opacity=".48"/><path d="M32 32V68M96 32V68" stroke="#8ba9aa" stroke-width="2" opacity=".38"/>
    <path d="M8 6H120" stroke="#e0ecea" stroke-width="4" opacity=".48"/><path d="M0 72H128V80H0Z" fill="#102e35" opacity=".58"/>
    <path d="M4 0H18V84H4ZM110 0H124V84H110Z" fill="#759397" opacity=".28"/>
  </g>
  <!-- West wall: its foot is exactly the tile's x=128 connection edge. -->
  <g transform="translate(256)">
    <path d="M66 0H91V128H66Z" fill="url(#cap)"/><path d="M91 0H128V128H91Z" fill="url(#side)"/>
    <path d="M65 0V128M126 0V128" stroke="#142f36" stroke-width="4"/><path d="M73 8V120" stroke="#e0ecea" stroke-width="4" opacity=".46"/>
    <path d="M98 7H119V121H98Z" fill="#31545a" opacity=".55"/><path d="M98 32H124M98 96H124" stroke="#142f36" stroke-width="3" opacity=".65"/>
    <path d="M120 0H128V128H120Z" fill="#0d2930" opacity=".55"/>
  </g>
  <!-- East wall: its foot starts at the tile's x=0 connection edge. -->
  <g transform="translate(384)">
    <path d="M37 0H62V128H37Z" fill="url(#cap)"/><path d="M0 0H37V128H0Z" fill="url(#side)"/>
    <path d="M2 0V128M63 0V128" stroke="#142f36" stroke-width="4"/><path d="M55 8V120" stroke="#e0ecea" stroke-width="4" opacity=".46"/>
    <path d="M9 7H30V121H9Z" fill="#31545a" opacity=".55"/><path d="M4 32H30M4 96H30" stroke="#142f36" stroke-width="3" opacity=".65"/>
    <path d="M0 0H8V128H0Z" fill="#0d2930" opacity=".55"/>
  </g>
  <!-- Exact edge-anchored corners. -->
  <g transform="translate(512)">
    <path d="M66 48H128V70H91V128H66Z" fill="url(#cap)"/><path d="M91 70H128V128H91Z" fill="url(#face)"/>
    <path d="M66 48H128M91 70H128M66 48V128" fill="none" stroke="#142f36" stroke-width="4"/><path d="M74 54H120" stroke="#e0ecea" stroke-width="4" opacity=".46"/>
  </g>
  <g transform="translate(640)">
    <path d="M0 48H62V128H37V70H0Z" fill="url(#cap)"/><path d="M0 70H37V128H0Z" fill="url(#face)"/>
    <path d="M0 48H62M0 70H37M62 48V128" fill="none" stroke="#142f36" stroke-width="4"/><path d="M8 54H54" stroke="#e0ecea" stroke-width="4" opacity=".46"/>
  </g>
  <g transform="translate(768)">
    <path d="M66 0H91V22H128V44H91V128H66Z" fill="url(#cap)"/><path d="M91 22H128V80H91Z" fill="url(#face)"/>
    <path d="M66 0V128M91 22H128M91 80H128" fill="none" stroke="#142f36" stroke-width="4"/><path d="M74 6H120" stroke="#e0ecea" stroke-width="4" opacity=".46"/>
  </g>
  <g transform="translate(896)">
    <path d="M37 0H62V128H37V44H0V22H37Z" fill="url(#cap)"/><path d="M0 22H37V80H0Z" fill="url(#face)"/>
    <path d="M62 0V128M0 22H37M0 80H37" fill="none" stroke="#142f36" stroke-width="4"/><path d="M8 6H54" stroke="#e0ecea" stroke-width="4" opacity=".46"/>
  </g>
</svg>
