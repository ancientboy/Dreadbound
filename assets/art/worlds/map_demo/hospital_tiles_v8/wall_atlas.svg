    <path d="M0 89H128M0 126H128" stroke="#18363d" stroke-width="3"/><path d="M32 94V124M96 94V124" stroke="#789a9c" stroke-width="2" opacity=".42"/><path d="M8 76H120" stroke="#d4e5e4" stroke-width="3" opacity=".5"/>
  </g>
