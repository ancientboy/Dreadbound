    <path d="M2 0V128M49 0V128" stroke="#17343b" stroke-width="3"/><path d="M42 8V120" stroke="#d4e5e4" stroke-width="3" opacity=".48"/><path d="M4 32H25M4 96H25" stroke="#26474d" stroke-width="2" opacity=".55"/>
  </g>
