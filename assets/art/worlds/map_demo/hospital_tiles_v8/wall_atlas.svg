    <path d="M0 19H128M0 57H128" stroke="#17343b" stroke-width="3"/><path d="M32 24V54M96 24V54" stroke="#789a9c" stroke-width="2" opacity=".42"/><path d="M8 6H120" stroke="#d4e5e4" stroke-width="3" opacity=".5"/>
  </g>
