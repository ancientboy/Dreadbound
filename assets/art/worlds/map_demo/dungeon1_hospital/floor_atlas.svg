<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18303a"/>
      <stop offset=".55" stop-color="#10252e"/>
      <stop offset="1" stop-color="#0b1b23"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28444d"/>
      <stop offset=".45" stop-color="#172f38"/>
      <stop offset="1" stop-color="#10242c"/>
    </linearGradient>
    <radialGradient id="wear">
