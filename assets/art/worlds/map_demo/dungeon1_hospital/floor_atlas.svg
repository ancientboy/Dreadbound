      <path d="M32 42H96M32 86H96M42 34V94M86 34V94" stroke="#52727a" opacity=".22"/>
      <circle cx="64" cy="64" r="12" fill="#0c222a" stroke="#4aa59c" stroke-opacity=".35" stroke-width="3"/>
