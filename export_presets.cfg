[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/art/characters/drifter/*,assets/art/characters/professions/*,assets/art/weapons/basic_weapons.png,assets/art/weapons/advanced_weapons.png,assets/art/weapons/director_reaper_growth.png,assets/art/weapons/conductor_railgun_growth.png,assets/art/weapons/boss_evolution_weapons.png,assets/art/weapons/equipment_runtime.png,character_pipeline/*,docs/*,tests/*,tools/*,scripts/martial_artist_trial_character.gd,scripts/universal_humanoid_action_character.gd"
export_path="builds/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>window.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('canvas');if(!c)return;c.addEventListener('webglcontextlost',e=>{const k='dreadbound-webgl-reload',n=Date.now(),p=Number(sessionStorage.getItem(k)||0);if(n-p>15000){e.preventDefault();e.stopImmediatePropagation();sessionStorage.setItem(k,String(n));setTimeout(()=>location.reload(),600);}},true);});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
